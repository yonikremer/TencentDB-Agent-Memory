# ── Context injection (injection pipeline) ─────────────────────────────────────────
# Injects relevant knowledge/memory/skills into the system prompt of every LLM request.
# The injection pipeline runs after session init completes.
# Each injector is an independent hook, executed in registration order.
#
# Optional injectors:
#   skill       — <cloud_skills> block: retrieves relevant skills from the kernel RAG and injects them into the system prompt;
#                 also injects a <skill_tools> block telling the LLM how to call skills via curl.
#                 Data source = the endpoint in the skill section (kernel gateway).
#   knowledge   — <knowledge_tools> block: pulls the team knowledge-resource list from the kernel
#                 and injects a two-step self-discovery flow tool (depends on skill.serviceToken).
#   tdai-memory — TDAI L2/L3 memory injection (controlled by tdai.memory.*; see the tdai section).
injection:
  enabled: true             # enable context injection (when off, the injectors list below is all disabled)
  injectors: ["skill", "knowledge", "tdai-memory"]   # injectors to enable
  # The unified external gateway address — the curl URLs embedded in the <skill_tools> / <tdai_memory_tools>
  # blocks the LLM generates all use it as their base. Put only the gateway hostname, **no port**
  # (the port the gateway uses to route internally to the proxy pod is configured ops-side on the gateway; irrelevant here).
  #
  # ⚠️ Required for multi-node deployments. When unset, each pod falls back to its own host:port → the same
  # hook cache in COS gets overwritten by different pods → upstream Anthropic KV cache misses every time (costly+slow).
  #
  # The gateway side must pass the two prefixes below through to the proxy pod verbatim:
  #   /skill-bridge/**   → proxy /skill-bridge/**
  #   /memory-bridge/**  → proxy /memory-bridge/**
  externalGatewayUrl: "https://gateway.example.com"

  # ── Asset reflection mode (for internal effect evaluation; on by default) ─────────────────────────────
  # Structure mirrors the costGuard.markerOptIn approach, but the default is inverted:
  #   markerOptIn=true (default): AssetReflectionInjector registers. The marker stays opt-in — only requests
  #                             whose URL carries an `/analyse` segment (structured like `/cost-guard`:
  #                             sandwiched after `/{agent}/{spaceId}`, e.g.
  #                             `/codebuddy/default/analyse/v1/messages`) emit
  #                             an `<asset_reflection>` block at the end of the system prompt, instructing the
  #                             agent to comment on"which cloud asset tools were called this turn and whether
  #                             each of them did anything useful". Normal requests without the marker are completely unaffected.
  #   markerOptIn=false: AssetReflectionInjector doesn't register, and the top gate 404s any request
  #                       carrying an `/analyse/` segment, zero performance cost. Suited to deployments
  #                       that explicitly confirmed they don't need asset reflection.
  # the tag list is decided by the asset injectors actually registered on this node (skill / tdai-memory /
  # knowledge); when none are enabled the injector never emits.
  assetReflection:
    markerOptIn: true


# ── Extraction (write side: pushes each turn's conversation/tool calls back to the kernel) ─────────────────────────────
# The dual of injection: injection decides"what goes into the prompt", extraction decides"what gets written back to the kernel".
#
# extractors allowlist (not in the list = not written back):
#   skill        — calls /v3/skill/conversation/add at the end of each real human turn; core archives by threshold
#                   (depends on skill.endpoint + skill.serviceToken)
#   tdai-memory  — writes user_query + assistant reply into L0 short-term memory each turn
#                   (depends on tdai.enabled + tdai.memory.writeL0)
#
# Default when this block is omitted: enabled=true, extractors=["skill","tdai-memory"] — equivalent to historical behavior.
# To "inject only, never extract": set extraction.enabled: false. One switch, done.
extraction:
  enabled: true
  extractors: ["skill", "tdai-memory"]


# ── Session init ──────────────────────────────────────────────
# Intercepts the user's first message and pops up an interactive form guiding team → agent → task selection;
# once selected, it pulls the agent/task details from the kernel and injects them into the system prompt.
#
# Flow:
#   1. Show an asset_confirm dialog: ask the user whether to associate team assets
#   2. Pick team (only shown when there are multiple teams)
#   3. Pick agent (pagination supported)
#   4. Pick task (optional, pagination / skip supported)
#   5. Register the session → inject agent/task context into the system prompt
#
# State storage: Redis by default (redis.enabled=true); with storage.enabled=true it uses
# ProxyStorage (COS/SQLite/FS). If neither is enabled it falls back to single-instance local SQLite.
# The team/agent/task list comes from the kernel MetadataClient (reuses the skill-section config).
# User identity is resolved in one auth/verify hop; failed auth / unrecognized user → bypass session init outright.
sessionInit:
  enabled: true             # enable session init
  maxRetries: 3             # max retries when the form fails to parse; past that it bypasses (skips session init)
  # Historical note: there used to be a keepInitArtifacts switch that stripped the
  # fake form conversation after session_init; it was removed. Now all real user conversations
  # (including session_init form interactions) are kept **forever**, nothing is deleted.
  # <session_context> injection switch: after session init, every request appends the agent/task
  # info as a <session_context> block to the system prompt. The two switches below can silence each part.
  # Both off = <session_context> is never injected. Both default to true, matching historical behavior.
  # When disabled, each session warns only once (avoids flooding long sessions).
  injectAgentContext: true  # false = don't inject the [Agent] section (id/name/description/prompt)
  injectTaskContext: true   # false = don't inject the [Task] section (id/name/description/goal)
  # header auto-preselect: when the first request's headers already carry identity fields, validate them
  headerAutoSelect:
    enabled: true            # enable header preselect
    teamHeader: "x-team-id"  # header name carrying team_id
    agentHeader: "x-agent-id" # header name carrying agent_id
    taskHeader: "x-task-id"  # header name carrying task_id (optional)
    onMismatch: "form"       # when a header value isn't found: form=fall back to the interactive form (default) | bypass=skip session init

  # ── DEBUG: local dev / e2e short-circuit ────────────────────────────────────────────────
  # With debugForceIdentity on, agentSource=workbuddy and agentSource=codebuddy
  # sessions are registered directly as a fixed triple, bypassing all form/header matching logic;
  # keep it commented out in production.
  # debugForceIdentity:
  #   team_id: team-xxxxxxxxxx
  #   agent_id: agt-xxxxxxxxxx
  #   task_id: task-xxxxxxxxxx
  # WorkBuddy client auth/verify has no real human identity → use this entry to hard-bind userId to
  # a real kernel user_id (pair it with the x-tdai-user-key in upstream.agents.workbuddy.apiKey,
  # i.e. a key under the same user). Keep it commented out in production.
  # debugForceUserId: usr-xxxxxxxxxx
  # Debug mode prints detailed diagnostic logs (request tools schema, system prompt summaries, etc.).
  # Local/E2E joint debugging only; in production keep it false or unset. Default off.
  # debugVerboseLogging: false


# ── TDAI Memory Gateway (core / openclaw-plugin) ────────────────────────────
# proxy reads/writes memory by talking to the co-located kernel gateway (listening on :8420)
# Four levels of memory:
#   L0 — short-term conversation memory (the last N turns written automatically)
#   L1 — session-level key-information extraction (reusable structured memories extracted from conversation)
#   L2 — Agent Profile (the agent's long-lived persona/rules/knowledge)
#   L3 — Team/Global memory (organizational knowledge shared across agents)
#
# Injection behavior:
#   with inject=true, L2+L3 are injected into the system prompt as system-level context;
#   L0/L1 are not injected directly into the prompt (it would break the KV cache); instead they are exposed as read-only tools the LLM queries on its own.
tdai:
  enabled: true             # enable TDAI Memory
  endpoint: "http://127.0.0.1:8420"   # kernel gateway address (usually the same as skill.endpoint)
  apiKey: "local"           # Authorization: Bearer value (usually the same as skill.serviceToken)
  serviceId: "default"      # x-tdai-service-id header value
  memory:
    enabled: true           # master switch for the Memory submodule
    inject: true            # master switch for context injection (false = all L0~L3 injection off)
    writeL0: true           # write L0 (short-term conversation memory)
    recallL1: true          # enable L1 recall (retrieve relevant memories from conversation)
    injectL2L3: true        # inject L2 (Agent Profile) + L3 (Team/Global memory) into the system prompt
    l1Limit: 5              # max L1 recall results
    l2Limit: 3              # max L2/L3 injection results
    timeoutMs: 5000         # per kernel call timeout (ms)


# ── Skill / kernel gateway data plane ──────────────────────────────────────────────
# The proxy uses this config to talk to the kernel gateway for three capabilities:
#   1. <cloud_skills> RAG injection: GET /v3/skill/search to retrieve relevant skills
#   2. Skill archive trigger: at the end of each real human turn it calls /v3/skill/conversation/add,
#      and core archives (async extraction) once tool_call ≥ 10 or bytes ≥ 40 KB.
#   3. the knowledge injector pulls the team knowledge-resource list
# The same serviceToken is also injected by the /skill-bridge reverse proxy when forwarding LLM curls,
# so the token never appears in a prompt the LLM can see.
# The sessionInit team/agent/task list also comes through this kernel (MetadataClient).
#
# Section-name compatibility: you may also write `coreSkill:` (old name, still read); when both exist, `skill:` wins.
skill:
  endpoint: "http://127.0.0.1:8420"   # kernel gateway address (usually the same as tdai.endpoint)
  serviceToken: "local"               # auth credential → Authorization: Bearer <serviceToken>
                                       #   must match the service allowlist agreed with the kernel; use "local" for local dev
  serviceId: "context-proxy"          # tenant/service id → x-tdai-service-id
                                       #   overridden by spaceId when the request path carries /proxy/<spaceId>/
  timeoutMs: 1500                     # per-call timeout (ms). RAG sits on the session_init hot path, so keep it small


# ── Knowledge tools injection (independent gateway config) ───────────────────────────────
# The proxy uses this config to reach the kernel gateway and pull team knowledge resources (code-graph / wiki),
# rendering a <knowledge_tools> block into the system prompt so the LLM can call the KS tools/list|call.
#
# Independent of the skill section: the endpoint can differ (e.g. skill via the kernel's direct IP,
# knowledge via an API Gateway domain).
#
# How to disable: enabled=false (default), the injector doesn't register, nothing is injected.
knowledge:
  enabled: false                        # off by default, consistent with tdai.enabled
  endpoint: "http://127.0.0.1:8420"     # kernel gateway address
  serviceToken: "local"               # Authorization: Bearer
  serviceId: "context-proxy"          # x-tdai-service-id (overridden by the spaceId in the request path)
  timeoutMs: 1500                     # per-call timeout (ms)


# ── Skill runtime ──────────────────────────────────────────────────────────
#
# skill extraction pipeline: at the end of each real human turn (the agent gives a final reply with no tool_use)
# the proxy synchronously calls POST /v3/skill/conversation/add, handing the conversation slice for this
# turn to core. Core maintains the buffer itself; once tool_call ≥ 10 or bytes ≥ 40 KB it archives and
# triggers a background Worker to extract the skill. No extra proxy config is needed.
#
# Historical config items (removed): extractToolCallThreshold / maxBucketCount /
# conversationAddEnabled — they belonged to the old proxy-side SkillExtractTrigger pipeline, now retired.
skillRuntime:
  allowLlmWrite: false           # allow the main model to create/modify skills (default false)
                                 #   false: <skill_tools> injects only read-only tools (search/list/view/files_read)
                                 #          /skill-bridge rejects write operations with 403
                                 #   true:  <skill_tools> injects all tools (including writes: create/update/delete, etc.)
                                 #          /skill-bridge permits write operations


# ── mem: special commands ──────────────────────────────────────────────────────────
# When the user types a command like mem:sync / mem:create-skill / mem:help in the chat box,
# the proxy intercepts it after session init, runs the operation, and returns a fabricated LLM response —
# no system prompt is injected (the KV cache stays intact) and nothing is forwarded to the upstream model (zero token cost).
# Record layers such as L0 writes / skill extract still run as usual, so the conversation timeline has no gaps.
#
# When off, messages starting with mem: are sent to the model normally, no interception.
memCommand:
  enabled: false                   # enable mem: command interception (default false, doesn't affect the existing pipeline)
  allowedCommands: []              # command allowlist; empty array = all allowed
                                   # e.g. ["sync", "help"] — only these two commands
                                   # allowed values: sync | create-skill | help

# ── CC request routing ────────────────────────────────────────────────────────────
# Detects the auxiliary requests that CC clients (Claude Code CLI) fire in the background and routes them differently:
#   - main (main chat / tool-loop):    full pipeline (session-init + injection + L0 + skill + credit)
#   - fork (SUGGESTION/RECAP/…):      reuse MAIN cache — skip session-init form / mem interception /
#                                L0 / skill; injection goes readOnly (doesn't self-heal the cache); credit reports
#   - sidequery (TITLE/probe/…):      standalone small requests — skip session-init / mem interception / injection /
#                                L0 / skill; credit reports
#
# Decision signals (hard source constraints + verified by packet capture):
#   1) cache_control marker on messages[n-2] → fork
#   2) cache_control marker on messages[n-1] or elsewhere → main
#   3) no marker + tools=[] + thinking.disabled → sidequery
#   4) anything else → main (safety net when a 3P provider disables caching)
#
# When off, every request is treated as main and goes through the exact equivalent of the old pipeline.
# See docs/design/2026-07-30-cc-request-routing-plan.md
ccRequestRouting:
  enabled: true                    # on by default. When off every request is forced to main; title-gen concurrency collides with session-init state and causes bypass.


# ── Per-Agent upstream routing ─────────────────────────────────────────────────────
# See the `upstream.agents` section at the top of this file.