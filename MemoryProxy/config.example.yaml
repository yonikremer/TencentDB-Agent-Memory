# ═══════════════════════════════════════════════════════════════════════════════
# Context Proxy — full configuration reference
# ═══════════════════════════════════════════════════════════════════════════════
#
# Every field has a default; anything left unset falls back automatically. Below is what each option means and how to use it.
#
# Request flow:
#   client request → auth (authentication) → sessionInit (session init: popup to pick team/agent/task)
#   → injection (context injection: skill/memory/wiki/knowledge into the system prompt)
#   → forward to the upstream LLM → usage/reporting → return to client
#
# Inter-module dependencies:
#   sessionInit depends on coreSkill (kernel :8420 fetches the team/agent/task list) + state storage
#   injection  depends on coreSkill (skill RAG injection) + tdai (memory L1/L2/L3)
#   auth       is standalone — calls the kernel POST /v3/meta/auth/verify to validate apiKey → user_id
#
# State-storage backends:
#   injection/skill data (inj:*/sk:*/vpin:*) goes to Redis by default; setting storage.enabled=true
#   switches it to ProxyStorage (COS/SQLite/FS/Memory). See the storage: section.
# ═══════════════════════════════════════════════════════════════════════════════


# ── Server ─────────────────────────────────────────────────────────────────
server:
  host: 0.0.0.0           # listen address; 0.0.0.0 = all interfaces
  port: 8096               # listen port
  forwardTimeoutMs: 600000 # upstream forward timeout (ms); default 600000 (10 min); 0 = no timeout


# ── Upstream LLM (default fallback) ──────────────────────────────────────────────────
upstream:
  # Upstream OpenAI-compatible API base URL (the proxy appends /v1/chat/completions automatically)
  # A full path is also accepted, e.g. https://llm-upstream.example.com/v2/
  url: https://tokenhub.example.com/v1
  # When set, replaces the Authorization: Bearer <apiKey> in all forwarded requests.
  # Leave empty to pass through the client's original API Key.
  apiKey: "<YOUR_TOKENHUB_API_KEY>"

  # ── Per-Agent Overrides ─────────────────────────────────────────────────────────
  # Overrides url + apiKey per agent name (URL path prefix /{agent}/...).
  # The Anthropic and OpenAI protocols share the same table.
  #
  # Fallback rules (important) — only an agent that is NOT configured here falls back to the outer upstream:
  #
  #   ┌─────────────────────────┬──────────────┬────────────────────────────┐
  #   │ the agent's config      │ url used     │ apiKey used                │
  #   ├─────────────────────────┼──────────────┼────────────────────────────┤
  #   │ not in agents           │ upstream.url │ upstream.apiKey (fallback) │
  #   │ in agents, url only     │ agent.url    │ client key passthrough     │
  #   │ in agents, url + apiKey │ agent.url    │ agent.apiKey               │
  #   └─────────────────────────┴──────────────┴────────────────────────────┘
  #
  # The middle row is a deliberate escape hatch in the design: once an agent appears in this table, the outer
  # upstream.apiKey fallback is cut off, letting operators run some agents on a server-side key while
  # others pass through the client's own key — all within the same proxy.
  #
  # Full priority (high → low):
  #   1. credentials built into costGuard's internal routing (cheap-model fallback)
  #   2. upstream.agents[agent].url + upstream.agents[agent].apiKey
  #   3. costGuard.anthropicUpstream.url (Anthropic protocol only)
  #   4. upstream.url + upstream.apiKey (default when no agent matches)
  agents: {}
    # claude-code:                                        # server-side key mode
    #   url: "https://claude-upstream.example.com/v1"
    #   apiKey: "sk-ant-agent-key"
    # codex:                                              # client-side key pass-through mode
    #   url: "https://codex-upstream.example.com/v1"
    #   # no apiKey → pass through the key the client sends, skip the outer fallback
    # Note: clients such as workbuddy / codebuddy / claude-code don't need their own per-agent override;
    # their requests naturally land on the outer upstream.url + the user_key used for auth, and the proxy
    # fetches the matching team/agent/task context from the kernel by user_id (no manual resource setup).
    # Create user assets (Team / Agent / Task / user grants) in the MemoryPanel web UI.


# ──── Multi-client onboarding (workbuddy / codebuddy / claude-code, etc.) ───────────────────
# MemoryProxy does not manage user assets. Team / Agent / Task / user grants are all created in the
# MemoryPanel web UI (port 8123). Client onboarding flow:
#
#   1. An admin, in MemoryPanel:
#      - creates a User and gets a user_key of the form sk-mem-xxx
#      - creates a Team and adds the user as a member
#      - creates Agent and Task under the Team
#   2. Client config (baseUrl only needs to reach {agent}/{spaceId}; the client SDK appends the API path):
#      - Base URL: http://<proxy-host>:8096/{agent}/{spaceId}
#        e.g. http://proxy.example.com:8096/workbuddy/mem-demo
#              http://proxy.example.com:8080/codebuddy/default
#      - API Key:  the user_key obtained in step 1 (sk-mem-* format)
#      - Model:    any model name the upstream supports
#   3. The client sends its first message → the proxy intercepts it → verifyUserKey → listTeams → listAgents
#      → listTasks → an interactive form to pick team/agent/task → register the session → automatically
#      inject L2(agent) + L3(team) memory into the system prompt each turn → forward to the upstream LLM.
#
# Multi-user isolation is inherent: listTeams(userId) returns only the teams that user belongs to, and
# listAgents is filtered a second time by user; different session_ids own independent session state machines.
#
# To skip the form while testing: enable debugForceIdentity / debugForceUserId below (local/E2E only).
# With them off, the full interactive form runs — the standard production path for multi-user setups.

# ── Logging ─────────────────────────────────────────────────────────────────────
log:
  file: logs               # log directory; writes a per-day usage JSONL plus structured proxy.log records
                           #   empty "" = no file output, console only
  verbose: false           # true = extra debug output to stderr
  level: info              # info | debug — debug adds routing/analysis detail
  backend: console         # noop | console — structured logs to stderr (console) or off (noop)
  rotate:
    maxSizeBytes: 104857600  # max bytes for one proxy.log file; rotated when exceeded (default 100 MB)
    backupLimit: 10          # how many rotation backups to keep


# ── Redis (injection / skill-layer historical backend) ────────────────────────────────────────
# Injection-layer / skill-layer data (inj:*, sk:*, skill:vpin:*) goes to Redis by default (historical behavior).
# Enabling storage.enabled=true below moves this data to ProxyStorage
# (COS/SQLite/FS/Memory). See the storage: section.
redis:
  enabled: true            # enable Redis; whether injection/skill data uses Redis is decided by storage.enabled.
  # url: "redis://:password@host:port/db"   # full Redis URL; if set, overrides host/port/password/db below
  host: "127.0.0.1"        # Redis host
  port: 6379               # Redis port
  password: ""             # Redis password
  db: 0                    # Redis database number
  ttlSeconds: 1800         # TTL (s) for injection & skill caches; default 1800 (30 min)
  # injectionTtlSeconds: 3600  # TTL (s) for the injection-layer hook cache; defaults to ttlSeconds
  # CostGuard session state (cg:sess:* / arch: / judge-*) also lives in this Redis.
  # Multi-instance deployments must enable it, or task archive / judge latch can't be shared across processes.


# ── Cost Guard (optional private routing extension; passes through transparently when the submodule is not initialized) ────────
# The host only parses enabled / markerOptIn / agentProfile / anthropicUpstream.
# All other fields are passed through verbatim in options to @context-proxy/cost-guard.
#
# options this extension will use (behavior when omitted):
#   taskArchiveEnabled  omitted = true. One extra synchronous gate LLM call per new user turn.
#   judge.enabled       omitted = false. When on, configure baseUrl; the host makes the HTTP calls.
#   compress* / gate*   omitted = fall back to the analyze model.
#   requestPrepare      CCR compression facade, independent of the routing switch.
costGuard:
  enabled: false
  markerOptIn: false       # true = route only /{agent}/{spaceId}/cost-guard/... through costGuard
  agentProfile: auto
  # anthropicUpstream:
  #   url: "https://anthropic-upstream.example.com"
  # analyzeModel: "deepseek-v4-flash"
  # analyzeUrl: "https://analyzer.example.com/v1/chat/completions"
  # analyzeApiKey: ""
  # analyzeProtocol: openai
  # analyzeTimeout: 30000
  # cheapModel: "deepseek-v4-pro"
  # cheapUrl: ""
  # cheapApiKey: ""
  # cheapProtocol: openai
  # toolLoopDegradeStrategy: none
  # agents:                  # override cheap config by the first URL segment (agentName)
  #   claude-code:
  #     cheapModel: "claude-haiku"
  #     cheapUrl: "https://cheap.example.com"
  # taskArchiveEnabled: true
  # compressModel: "deepseek-v4-flash"  # selector + merge; falls back to analyze* when omitted
  # compressUrl: "https://analyzer.example.com/v1/chat/completions"
  # compressApiKey: ""
  # compressProtocol: openai
  # compressTimeout: 30000
  # gateModel: "deepseek-v4-flash"      # synchronous hot path; falls back to compress* when omitted
  # gateUrl: "https://analyzer.example.com/v1/chat/completions"
  # gateTimeout: 8000
  # judge:
  #   enabled: false
  #   baseUrl: "http://judge.example.com"
  #   userTurnTimeoutMs: 25000
  #   agentTurnTimeoutMs: 10000
  #   everyNToolTurns: 5
  #   latchTtlSeconds: 0
  #   latchMaxTurns: 0
  # controlPlane:            # this block existing enables it; omit the whole block to disable
  #   port: 18097
  # requestPrepare:
  #   enabled: false


# ── Memory instance × actual-model Input TPM / QPM limits ──────────────────────────────
# Applies to all main-model calls whose URL carries a spaceId.
# Multi-pod counting is atomic through the shared Redis above. When Redis is unavailable it fails open and logs a warning.
# Per-instance/model overrides are managed via /v3/admin/rate-limits and take effect on the next request.
rateLimit:
  tpm: 1000000             # actual Input Tokens / last 60 s
  qpm: 100                 # requests initiated / last 60 s; same dimension as TPM


# ── Storage (unified storage for the injection + skill layers, replacing Redis for inj:*/sk:*/vpin:*)─
# See docs/design/2026-07-09-redis-to-cos-migration-plan.md
#
# [MASTER SWITCH]storage.enabled=false (default) → fully Redis-backed old path; no migration code loads,
#           behavior is **exactly** as before this migration.
# [SWITCHING SEMANTICS]storage.enabled=true → replace the inj:*/sk:*/vpin:*
#           Redis repos with ProxyStorage.
#
# [PRODUCTION RECOMMENDATION]
#   - single-instance local/internal: backend=sqlite (default; uses ~/.tdai-memory-proxy/proxy.db)
#   - production multi-instance:    backend=cos (shared across nodes + cheap object storage)
#   - offline / private deployment: backend=fs
#   - fallback / tests:             backend=memory
#
# [DEGRADATION CHAIN]cos → sqlite → fs → memory; a failing backend init auto-degrades,
#          /health exposes storage.effective (the anchor for production monitoring alerts)
#
# [ROLLBACK]flipping enabled=false at any point returns to the Redis path without a restart.
#
# ═══════════════════════════════════════════════════════════════════════════
# Field quick reference ([req] = required / [opt] = optional with a default / [dead] = not read under this backend; deleting it has no effect)
#
#   ┌──────────────────────┬──────────┬────────────────────────────────────────────┐
#   │ field                │ cos      │ sqlite / fs / memory                       │
#   ├──────────────────────┼──────────┼────────────────────────────────────────────┤
#   │ enabled              │ [req]    │ [req]                                      │
#   │ backend              │ [req]    │ [req]                                      │
#   │ ttlDays              │ [dead]*  │ sqlite=[opt, dflt 7] fs/memory=[dead]      │
#   │ cos.rootPrefix       │ [dead]** │ [dead]                                     │
#   │ cos.endpointDomain   │ [opt]    │ [dead]                                     │
#   │ cos.shark.baseUrl    │ [req]    │ [dead]                                     │
#   │ cos.shark.* (others) │ [opt]    │ [dead]                                     │
#   │ sqlite.dbPath        │ [dead]   │ sqlite=[opt, dflt empty] others=[dead]     │
#   │ fs.fsRoot            │ [dead]   │ fs=[req] others=[dead]                     │
#   └──────────────────────┴──────────┴────────────────────────────────────────────┘
#
#   * cos bucket expiry relies on the COS lifecycle rule, not ttlDays
#   ** shark hard-codes "proxy_cache"; any value set on the proxy side is ignored
# ═══════════════════════════════════════════════════════════════════════════
storage:
  # [req] master switch: false = fully the old Redis path (default)
  enabled: false

  # [req] preferred backend: cos | sqlite | fs | memory
  #   - cos:    production multi-instance (shared across nodes)
  #   - sqlite: single-instance local dev / CI; a sweeper clears ttl buckets automatically
  #   - fs:     offline / docker fallback; no sweeper
  #   - memory: fallback / tests; cleared on process restart
  # Production multi-node must use cos; sqlite/fs/memory are all process-local and always read-miss across nodes.
  backend: sqlite


  # ── TTL / NoTTL prefix buckets (business code buckets by key prefix; see the 2026-07-10 design)─────
  # `ttl/`   — hot cache: inj-sess (session-init state) / inj-hook (pre-warmed injection).
  #             Losing these is fine — they can be rebuilt (binding fallback / re-running the hook); users don't notice.
  # `nottl/` — business state: binding / sk-extract / skill-vpin. Kept **forever**,
  #             no lifecycle rule is configured; losing them forces users to redo the session_init form.
  #
  # Only the `ttl/` prefix is ever cleaned (per backend):
  #   - CosStorage:    ⚠️ ttlDays is **not read**! Configure a lifecycle rule in the COS console:
  #                    delete `proxy_cache/ttl/` keys not modified for N days. **nottl/ is never cleaned**.
  #   - SqliteStorage: a built-in sweeper clears the ttl buckets of the proxy_kv table by ttlDays every 5 min
  #   - FsStorage:     no sweeper (container FS mtime is unreliable); delegate to an external tmpwatch
  #   - MemoryStorage: cleared on process restart; this TTL does not apply
  #
  # [cos=dead / sqlite=opt default 7 / fs+memory=dead] cleanup window (days) for the `ttl/` prefix.
  ttlDays: 7

  # ── COS backend (top pick for production multi-instance) ─────────────────────────────────────────────
  # Before going live you must configure a lifecycle rule in the COS console:
  #   `proxy_cache/ttl/`   prefix not modified for N days → delete
  #   `proxy_cache/nottl/` prefix → configure no rule → keep forever
  #
  # Only kernel-sts mode is supported (static AK/SK is forbidden in production):
  # - each spaceId pulls an independent STS from Shark, with permissions strictly scoped to the
  #   `proxy_cache/ttl/{spaceId}/*` + `proxy_cache/nottl/{spaceId}/*` prefixes
  # - bucket / region are parsed from the CosUrl Shark returns; nothing to configure
  # - when endpointDomain is unset the choice is automatic through a 4-level priority (see the field note); leaving it blank just works
  # - if Shark is unavailable the COS backend fails to assemble; the process won't start degraded
  # See docs/design/2026-07-12-cos-shark-sts-credential-plan.md
  #
  # Key layout:
  #   proxy_cache/{ttl|nottl}/{spaceId}/{userId}/{agentSource}/{sessionId}/...
  # ttl/nottl must come before the spaceId — lifecycle rules don't support mid-path wildcards.
  #
  # The whole block can be deleted when backend != cos.
  cos:
    # [dead] shark hard-codes "proxy_cache"; the proxy layer never reads this field.
    # Kept only for backward-compatible yaml structure; will be removed in the future. Deleting it doesn't affect runtime.
    rootPrefix: "proxy_cache/"

    # [opt] overrides the COS SDK endpoint domain. **Highest priority**.
    # When unset (empty / undefined), it is chosen automatically through a 4-level priority, aligned with core
    # `tdai-memory-openclaw-plugin/src/gateway/server.ts::initSharedCosClient`:
    #   1. this field is set                                   → use it
    #   2. Shark CosUrl is already a VPC-internal address (cloud vendor internal domain) → use it
    #   3. Shark CosUrl is public → rewrite it to the VPC-internal domain (built from cred.region)
    #   4. none of the above apply (cred has no region)         → SDK default public endpoint
    # Production kernel-sts deployments (inside a cloud VPC) usually leave it blank — it auto-uses the internal network, cheaper and more stable.
    # Deployments outside the cloud VPC must explicitly set a public / custom domain and ensure the bucket allows that network.
    # Supports the `{Bucket}` placeholder (custom CDN scenarios).
    endpointDomain: ""   # e.g. `cos.example.com` (custom CDN or public mapping)

    # ── Shark temporary credential fetch ──
    # Shark's interface is `POST /meta/GetProxyCacheCosConfig` (see the design doc, §3.1).
    shark:
      # [req] Shark admin-plane base URL. Test-environment address; production overrides it in config.yaml.
      baseUrl: "http://gateway.example.com:8000"

      # [opt] shark HTTP request timeout (ms). Default 10000.
      timeoutMs: 10000

      # [opt] retries on 5xx / 429 / network errors / timeouts. Default 2.
      retryCount: 2

      # [opt] how many ms before STS expiry to refresh. Default 120000 (2 min).
      # Availability impact: too short → shark jitter makes you use expired credentials; too long → needless frequent refreshes.
      refreshBufferMs: 120000

      # [opt] per-spaceId backend pool cap (LRU). Default 100.
      # Capacity impact: once multi-tenant spaces exceed this, LRU evicts (grace-closing old backends).
      maxSpaces: 100

      # [opt] ms to delay closing an old backend on LRU eviction (protects in-flight requests). Default 30000.
      graceCloseDelayMs: 30000

  # ── SQLite backend (single-instance local dev / CI) ─────────────────────────────────────
  # The only backend where "editing yaml ttlDays takes effect immediately" — the sweeper clears the
  # ttl buckets of the proxy_kv table by the top-level ttlDays every 5 min (nottl buckets are kept forever).
  # The whole block can be deleted when backend != sqlite.
  sqlite:
    # [sqlite=opt default empty / others=dead] empty = PROXY_DB_PATH env or ~/.tdai-memory-proxy/proxy.db
    dbPath: ""

  # ── Local file system (offline / docker read-only fallback) ──────────────────────────────────
  # No sweeper (fs.stat().mtime is unreliable on container FS); delegate cleanup to an external tmpwatch.
  # The whole block can be deleted when backend != fs.
  fs:
    # [fs=req / others=dead] root directory (must be writable)
    fsRoot: "/var/lib/context-proxy/storage"


# ── Opik LLM observability (Comet ML Opik) ─────────────────────────────────────────
# Request/response traces and spans are reported to Opik automatically.
opik:
  enabled: false           # enable Opik reporting
  url: "http://127.0.0.1:5173"   # Opik service address
  apiKey: ""               # Opik API Key (if the Opik instance requires auth)
  # stripRequestLogContent: false  # true = the forked request_log trace doesn't record message content (saves storage)


# ── Langfuse LLM observability (official SDK reporting) ──────────────────────────────────────
# One trace = one turn (a single user input); tool-loop requests in the same turn group under one
# trace as multiple generations. Reported content: model/latency/token usage/cache hits/cost.
langfuse:
  enabled: false           # enable Langfuse reporting
  host: ""                 # Langfuse instance base URL, e.g. http://localhost:3000
                           #   OTLP mode: put the OTLP endpoint here
  publicKey: ""            # Langfuse public key (pk-lf-...); OTLP mode: put the token here
  secretKey: ""            # Langfuse secret key (sk-lf-...); OTLP mode: leave empty


# ── ClickHouse usage reporting ──────────────────────────────────────────────────────
# Records each user's token consumption per turn, queryable by model / user / session.
# Table layout: timestamp / model_id / key_id(user) / session_key + turn_seq(turn) /
#           user_input / prompt_tokens / completion_tokens / total_tokens /
#           cache_hit_tokens / cache_write_tokens
# 4xx/5xx failed requests are not written.
clickhouse:
  enabled: false           # enable ClickHouse usage reporting
  url: "http://clickhouse.example.com:8123"   # ClickHouse HTTP endpoint
  database: context_proxy            # database name
  table: usage_logs                  # usage table name (known format, e.g. TokenHub)
  rawTable: usage_raw                # raw usage tracing table (non-TokenHub / unknown formats fall back here)
  user: default                      # ClickHouse username
  password: ""                       # ClickHouse password
  flushIntervalMs: 5000              # periodic flush interval (ms); default 5 s
  flushThreshold: 50                 # flush immediately once the buffer holds N records (0 = disable batched flush)
  ttlDays: 30                        # data retention days (0 = never expire; applied at startup via CREATE TABLE TTL)


# ── Auth (user_key verification → user_id resolution) ─────────────────────────────────
# When enabled, the proxy calls the kernel POST /v3/meta/auth/verify to validate the client API Key.
# Any result other than valid=true rejects the request with 401 (including timeouts/network errors).
# x-tdai-service-id is extracted automatically from the request path /proxy/<spaceId>/...
# After a successful validation, user_id is written to the ClickHouse key_id column and used as the end-to-end user identity.
auth:
  enabled: true            # enable authentication
  url: "http://kernel.example.com:8420"   # kernel auth service base URL (appends /v3/meta/auth/verify automatically)
  timeoutMs: 5000          # auth request timeout (ms)


# ── Admin / Ops endpoint auth (service-level shared secret) ─────────────────────────────
# Scope: only ops endpoints like `/v3/instance/proxy-destroy` (clears the proxy-side COS cache when
# shark destroys an instance). Fully independent of the tenant verifyUserKey in auth.* above — that is the
# tenant-scoped x-tdai-user-key check; this is a shared secret for ops/system services.
#
# Behavior (semantics aligned with the core gateway's server.apiKey; see openclaw-plugin
# gateway/server.ts:1076-1089):
#   - apiKey empty (default)      = auth off; ops endpoints are publicly reachable; no startup warning
#                                 (production relies on network isolation + apigw fallback, the same way core
#                                 doesn't enable `TDAI_GATEWAY_API_KEY` in production today)
#   - apiKey non-empty            = requests must carry `Authorization: Bearer <apiKey>`
#                                 constant-time comparison (crypto.timingSafeEqual)
#
# How to choose a value:
#   - a fixed string agreed between both sides (proxy + shark), unrelated to any specific instance
#   - usually ops generate it with `openssl rand -hex 32` and distribute it to the proxy's
#     `TDAI_PROXY_ADMIN_API_KEY` env and shark's client config
#   - it is not the admin user_key of any memory instance (that one goes through `x-tdai-user-key`,
#     an instance-internal user concept — the two have nothing to do with each other)
#
# Priority: env TDAI_PROXY_ADMIN_API_KEY > yaml admin.apiKey > default ""
admin:
  apiKey: ""               # empty = ops endpoints are public (same as not configuring). In production set it
                           # via the env TDAI_PROXY_ADMIN_API_KEY to avoid committing it to git


# ── System users (internal service accounts: pass through the whole chain on match) ─────────────────────────────
# Match flow: the apiKey first goes through auth/verify to get a user_id → if that user_id is in systemUsers
# below → matched, short-circuited to pass-through. The proxy then forwards the request verbatim to
# config.upstream.url, skipping session init and context injection.
# usage/credit is still recorded (keyId = userId, spaceId = the memory instance id in the path).
# Depends on auth.enabled=true — with auth off, verify returns an empty user_id and the short-circuit never fires.
# The userKey field is kept only as an ops reference (it used to be the match key; it now only appears in logs/comments),
# so it can be omitted; userId is required. The array accepts multiple entries; an empty array disables the feature.
systemUsers:
  - name: memory                              # logical name, for logs only
    userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"   # match key & billing owner's user_id (required)
    displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
    userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}" # legacy sk-mem-xxx, for ops review only (optional)
  # - name: wiki
  #   userId: "${TDAI_WIKI_SYSTEM_USER_ID}"
  #   displayName: "${TDAI_WIKI_SYSTEM_USER_NAME}"
  #   userKey: "${TDAI_WIKI_SYSTEM_USER_KEY}"


# ── Credit reporting (TDAI MemoryPlus billing) ──────────────────────────────────────
# After each LLM response finishes, this round's CreditDelta is computed from the creditPricing table and
# POSTed to the external billing service. Only TokenHub upstreams price; non-TokenHub upstreams get CreditDelta=0.
# Only requests carrying a /proxy/<spaceId>/ prefix trigger reporting; SpaceId is extracted from the path.
# Streaming requests are best-effort: a failed report only logs, it never interrupts the stream.
# When a non-streaming request fails, the reason is recorded in the `x-credit-report-error` response header.
creditReport:
  url: "http://gateway.example.com:8000/UpdateMemoryPlusUsage"
  timeoutMs: 5000          # report timeout (ms); 0 = no timeout


# ── Credit pricing table ────────────────────────────────────────────────────────
# Unit: Credit / 1K Token.
# Model matching: usage.model → case-insensitive whole-token match → no match = credit=0
#   (falls back to the usage_raw table and marks reason='unknown_model').
# Field notes:
#   name          — model ID (used to match usage.model, case-insensitive whole-token match)
#   modelName     — display name (optional, for UI/reports; falls back to name when unset)
#   input         — standard input tokens (non-cached portion)
#   output        — output tokens
#   cacheRead     — tokens read from a cache hit (prompt_cache_hit_tokens / cache_read_input_tokens)
#   cacheWrite5m  — tokens written to a 5-minute TTL cache (cache_creation.ephemeral_5m_input_tokens)
#   cacheWrite1h  — tokens written to a 1-hour TTL cache (cache_creation_input_tokens non-ephemeral portion)
creditPricing:
  models:
    - name: "your-endpoint-id"         # endpoint id / model alias assigned by the upstream, e.g. Claude Sonnet
      modelName: "Claude Sonnet"
      input: 5.4935
      output: 27.4673
      cacheRead: 0.5493
      cacheWrite5m: 6.8668
      cacheWrite1h: 10.9869

