# Native/The build script depends on the whitelist.better-sqlite3 Need to compile native binding;esbuild / protobufjs
# rely postinstall script. Value is Boolean true Only then will the corresponding package be released to run. build scripts;
# When default (or non-boolean placeholder) pnpm 11 Will ignore and report ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  protobufjs: true
