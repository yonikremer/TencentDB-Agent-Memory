# ============================================================
# TDAI Gateway — default configuration (Standalone + Skill)
# ============================================================
# Based on standalone single-machine mode, with the Skill module enabled.
# The Memory engine and Skill module share the same baseDir without interfering:
#   - Memory data: {baseDir}/conversations/, records/, scene_blocks/, persona.md ...
#   - Skill data:  {baseDir}/skills/<name>/SKILL.md + files/
#   - Shared DB:   {baseDir}/vectors.db
#
# Startup:
#   export TDAI_LLM_API_KEY="sk-..."           # required
#   export TDAI_LLM_BASE_URL="https://..."     # optional (overrides yaml)
#   export TDAI_LLM_MODEL="gpt-4o-mini"        # optional
#   node --import tsx src/gateway/server.ts
#
# Self-check:
#   curl -s http://127.0.0.1:8420/health | jq
#   curl -s -X POST http://127.0.0.1:8420/v3/skill/list \
#     -H "x-tdai-service-id: default" \
#     -H "Content-Type: application/json" -d '{"team_id":"smoke-team"}'
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"
  # apiKey: "skill-mvp"   # optional; when unset all v2 APIs are open by default (local only)

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM (required) ──
# provider defaults to "openai" for direct connection; to use context_proxy (unified auth/billing/observability),
# see tdai-gateway.proxy.yaml or docs/llm-via-proxy.md
llm:
  baseUrl: "https://api.lkeap.cloud.tencent.com/v1"
  apiKey: "${TDAI_LLM_API_KEY}"
  model: "deepseek-v3.2"
  maxTokens: 32000
  timeoutMs: 300000

# ── Memory engine configuration ──
memory:
  promptMode: code

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  # ── Storage backend ──
  storeBackend: "sqlite"

  embedding:
    provider: "none"               # vector search off by default; BM25 only
    # Example for enabling vector search:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# ── Skill module ──
# Skill is an extra capability; data is stored under {baseDir}/skills/ and does not affect the Memory engine.
# Set enabled: false or delete this section to fully disable skill; Memory is unaffected.
skill:
  enabled: true

  # [reuse] If storeBackend is unset it inherits memory.storeBackend (here, sqlite);
  #         tcvdb requires TCVDB credentials (memory.tcvdb); falls back to sqlite when missing.
  # storeBackend: "sqlite"
  # [probe] If contentBackend is unset it auto-probes: COS credentials (cos.*) present → cos, otherwise → local.
  # contentBackend: "local"

  routing:
    mode: "bm25"          # bm25 | embedding | hybrid (the latter two require memory.embedding enabled, otherwise fall back to bm25)
    searchTopK: 20        # max skills injected into the listing API (name+description)
    # Reserved fields below: resolver has defaults but no runtime consumers yet; leave them as-is.
    # hybridAlpha: 0.3
    # charBudgetPercent: 0.01
    # fastPathMinNameLength: 4

  extraction:
    enabled: true                 # requires a valid top-level llm config (baseUrl + apiKey)
    maxIterations: 16             # Review Agent tool-calling max iterations
    # model: "deepseek-v3.2"      # [reuse] unset → reuse top-level llm.model
    # toolCallThreshold: 10       # reserved field, no consumers yet
    # Note: headChars / tailChars are not forwarded on the per-instance extractor path in service mode,
    #       so they are not exposed in yaml; to tune them, change skill-extractor.ts defaults or add server.ts forwarding.
    queue:
      backend: "local"            # standalone uses an in-process queue; switch to "redis" in service mode
      keyPrefix: "tdai"           # Redis key prefix (redis backend)
      resultTtlSeconds: 86400     # TTL of the extraction-result hash (seconds)
      lockTtlMs: 600000           # agent-level lock TTL (ms, 10min)
      maxRetries: 2               # max retries when extraction fails
      retryBackoffsMs: [5000, 15000]  # backoff between each retry (ms)
      # [reuse] service mode reuses the top-level shared redis client; leave redisUrl empty;
      #         if a shared client is detected, it automatically switches to redis even with backend=local.
      # redisUrl: "redis://:password@host:6379/0"

  resources:
    maxResourceSizeBytes: 5000000  # ✅ active: single resource file size cap (5MB); rejects writes beyond it
    # The following unwired fields were removed from the active config:
    #   allowExecutable — intended as an executable-resource safety switch, but not passed to SkillResourceStore, so nothing is blocked
    #   downloadDir     — intended as a temp dir for downloaded resources, but resource reads return in-memory, so no consumer

  # versionTtlDays: 0             # old (non-head) version expiry in days; 0 = never expires

# ── Observability config (local development) ──
observability:
  otel:
    enabled: false                    # no local link to Zhiyan; OTel gRPC off
  clickhouse:
    enabled: false
  kafka:
    enabled: false
  langfuse:
    enabled: true
    # Production endpoint / credentials injected from env to avoid committing them to the repo or image.
    # With empty values core auto-skips langfuse reporting (no fail); export as needed for local dev.
    host: "${LANGFUSE_HOST:-}"
    publicKey: "${LANGFUSE_PUBLIC_KEY:-}"
    secretKey: "${LANGFUSE_SECRET_KEY:-}"

# ── Metadata module (v3 store + password pepper; sensitive ${} injected from .env) ──
metadata:
  maxUsersPerInstance: 500
  maxTeamsPerInstance: 100
  store:
    mongoUri: "${TDAI_METADATA_MONGO_URI}"
    mongoDbPrefix: "${TDAI_METADATA_MONGO_DB_PREFIX}"
    mongoTransactions: true
  systemUser:
    memory:
      userId: "${TDAI_MEMORY_SYSTEM_USER_ID}"
      displayName: "${TDAI_MEMORY_SYSTEM_USER_NAME}"
      userKey: "${TDAI_MEMORY_SYSTEM_USER_KEY}"
