# ============================================================
# TDAI Gateway — Standalone (single-machine) configuration
# ============================================================
# Use cases: local development / Hermes sidecar / single-agent standalone deployment
# Highlights: zero external dependencies (no Redis/Shark), in-process state management
# ============================================================

deployMode: standalone
stateBackend: "local"

server:
  port: 8420
  host: "127.0.0.1"

data:
  baseDir: "~/.memory-tencentdb/memory-tdai"

# ── LLM (required) ──
llm:
  baseUrl: "https://api.openai.com/v1"
  apiKey: "${TDAI_LLM_API_KEY}"    # injected via environment variable
  model: "gpt-4o"
  maxTokens: 4096
  timeoutMs: 120000

# ── Memory engine configuration ──
memory:

  capture:
    enabled: true

  extraction:
    enabled: true
    enableDedup: true
    maxMemoriesPerSession: 20

  persona:
    triggerEveryN: 50
    maxScenes: 15

  pipeline:
    everyNConversations: 5
    enableWarmup: true
    l1IdleTimeoutSeconds: 600
    l2DelayAfterL1Seconds: 90
    l2MinIntervalSeconds: 900
    l2MaxIntervalSeconds: 3600

  recall:
    enabled: true
    maxResults: 5
    scoreThreshold: 0.3
    strategy: "hybrid"
    timeoutMs: 5000

  # ── Storage backend ──
  # sqlite: local SQLite (default, zero config)
  # tcvdb:  Tencent Cloud Vector Database (requires the tcvdb config below)
  storeBackend: "sqlite"

  # To use TCVDB, uncomment and fill in:
  # storeBackend: "tcvdb"
  # tcvdb:
  #   url: "http://10.0.1.1:80"
  #   username: "root"
  #   apiKey: ""
  #   database: ""
  #   embeddingModel: "bge-large-zh"
  #   timeout: 10000

  embedding:
    provider: "none"               # vector search off by default; BM25 only
    # Example for enabling vector search:
    # provider: "openai"
    # baseUrl: "https://api.openai.com/v1"
    # apiKey: "${TDAI_LLM_API_KEY}"
    # model: "text-embedding-3-small"
    # dimensions: 1536

  bm25:
    enabled: true
    language: "zh"

# ── Skill module (optional; off by default) ──
# Skill adds extra capabilities and does not affect the Memory engine above.
# When enabled, skill data is stored under {baseDir}/skills/.
# Can also be enabled via env var TDAI_SKILL_ENABLED=true.
# skill:
#   enabled: true
#   routing:
#     mode: "bm25"
#     searchTopK: 20        # max skills injected into the listing API (name+description)
#   extraction:
#     enabled: true         # requires a valid llm config
#     maxIterations: 16
#   resources:
#     maxResourceSizeBytes: 5000000
#     allowExecutable: false
